name: Deploy Vue to Aliyun OSS

# 触发条件：当 master 分支收到 push 时触发
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dayin-website/package-lock.json

      # 3. 安装依赖并打包
      - name: Install Dependencies & Build
        working-directory: dayin-website
        run: |
          npm install
          npm run build

      # 4. 部署到阿里云 OSS
      - name: Upload to Aliyun OSS
        uses: manyuanrong/setup-ossutil@v2.0
        with:
          endpoint: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 5. 执行上传命令（将 dist 目录下的文件复制到 OSS 根目录）
      - name: Copy files to OSS
        working-directory: dayin-website
        run: |
          ossutil cp -r dist/ oss://${{ secrets.ALIYUN_OSS_BUCKET }}/ --force
